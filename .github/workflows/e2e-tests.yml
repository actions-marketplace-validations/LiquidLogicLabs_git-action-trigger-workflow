name: E2E Tests

on:
  workflow_call:
    secrets:
      TEST_GITHUB_TOKEN:
        # Declared so a caller can pass it explicitly. Without this declaration GitHub
        # rejects `secrets: {TEST_GITHUB_TOKEN: ...}` at parse time, which is why
        # `secrets: inherit` was used -- it works without a declaration.
        required: false
      TEST_GITEA_TOKEN:
        required: false
  workflow_dispatch:

concurrency:
  # Distinct 'e2e-' prefix: release.yml calls this workflow and groups on
  # ${{ github.workflow }}-<ref>, which resolves to the SAME value here when called.
  # CLAUDE.md records a shared group between caller and callee as a deadlock.
  group: e2e-${{ github.workflow || 'E2E Tests' }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

# Floor for every job in this file. actions: write is granted on the e2e job alone --
# it is the only thing that needs it (the action under test dispatches workflow runs).
permissions:
  contents: read

jobs:
  e2e:
    permissions:
      contents: read
      actions: write   # the action under test dispatches a workflow run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false

      - name: Smoke test - action runs from committed dist (current repo)
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          workflow-name: 'CI'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch workflow on test repo (GitHub)
        if: vars.TEST_GITHUB_REPO != ''
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          repo: ${{ vars.TEST_GITHUB_REPO }}
          workflow-name: ${{ vars.TEST_GITHUB_WORKFLOW || 'E2E Trigger Test' }}
          ref: ${{ vars.TEST_GITHUB_REF || 'main' }}
          token: ${{ secrets.TEST_GITHUB_TOKEN }}

      - name: Dispatch workflow on test repo (Gitea)
        if: vars.TEST_GITEA_REPO != ''
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          repo: ${{ vars.TEST_GITEA_REPO }}
          workflow-name: ${{ vars.TEST_GITEA_WORKFLOW || 'E2E Trigger Test' }}
          ref: ${{ vars.TEST_GITEA_REF || 'main' }}
          token: ${{ secrets.TEST_GITEA_TOKEN }}
